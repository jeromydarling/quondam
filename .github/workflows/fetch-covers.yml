name: fetch-covers

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch even entries that already have a coverUrl"
        type: boolean
        default: true
      only:
        description: "Pipeline stages: s3=AI only (default, recommended), s1=archive.org, s2=Wikipedia. Comma-separate for multiple."
        type: string
        default: "s3"
      id:
        description: "Single story id to process (leave blank for regen list or full catalog)"
        type: string
        default: ""
      series:
        description: "Process only entries matching this series.id. Leave blank for all."
        type: string
        default: ""
      use_regen_list:
        description: "Only regenerate IDs in .github/regen-covers.txt (default: true)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-covers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Run cover pipeline
        env:
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          BASE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            BASE_ARGS+=(--force)
          fi
          if [ -n "${{ inputs.only }}" ]; then
            BASE_ARGS+=(--only "${{ inputs.only }}")
          fi

          # Use an existing Recraft cover as Ideogram style reference
          STYLE_ARGS=()
          if [ -f public/covers/librivox-gk-chesterton-st-francis-ch1.jpg ]; then
            STYLE_ARGS+=(--style-ref public/covers/librivox-gk-chesterton-st-francis-ch1.jpg)
          fi

          # If a single ID or series is specified, use that directly
          if [ -n "${{ inputs.id }}" ]; then
            echo "Running single ID: ${{ inputs.id }}"
            npm run covers -- "${BASE_ARGS[@]}" "${STYLE_ARGS[@]}" --id "${{ inputs.id }}"
          elif [ -n "${{ inputs.series }}" ]; then
            echo "Running series: ${{ inputs.series }}"
            npm run covers -- "${BASE_ARGS[@]}" "${STYLE_ARGS[@]}" --series "${{ inputs.series }}"
          elif [ "${{ inputs.use_regen_list }}" = "true" ] && [ -f .github/regen-covers.txt ]; then
            echo "Running from .github/regen-covers.txt (single process)"
            npm run covers -- "${BASE_ARGS[@]}" "${STYLE_ARGS[@]}" --ids-file .github/regen-covers.txt
          else
            echo "Running full catalog"
            npm run covers -- "${BASE_ARGS[@]}" "${STYLE_ARGS[@]}"
          fi

      - name: Validate catalog after run
        run: npm run validate:catalog

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog or cover file changes — nothing to PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git status --short
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="covers/auto-${{ github.run_id }}"
          git config user.name "quondam-cover-bot"
          git config user.email "quondam-cover-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add catalog/catalog.json public/covers/
          git commit -m "Auto-fetch covers (run ${{ github.run_id }})"
          git push origin "$BRANCH"

          BODY=$(cat <<'BODY_EOF'
          Automated run of `scripts/fetch-covers.mjs` via the
          `fetch-covers` workflow.

          **Before merging, please spot-check `public/covers/*.jpg`** in an
          image viewer.

          See `scripts/README.md` for details.
          BODY_EOF
          )
          gh pr create \
            --title "Auto-fetch covers (run ${{ github.run_id }})" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
